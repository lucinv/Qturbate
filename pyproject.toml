[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qturbate"
version = "0.1.0"
description = "Chaturbate stream viewer (PyQt6)"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "cloudscraper",
    "pydantic",
    "pillow",
    "requests",
    "PyQt6",
]

[project.scripts]
qturbate = "main_tk:main"

[tool.setuptools]
py-modules = ["app", "main_tk"]

[tool.setuptools.packages.find]
include = ["app_factory*", "domain*", "services*", "storage*", "ui*"]

[tool.setuptools.package-data]
app_factory = ["templates/**/*", "static/**/*"]
