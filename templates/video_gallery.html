{% extends "layout.html" %}

{% block title %}Video Gallery{% endblock %}

{% block content %}
<div class="container">
  {% for video in videos %}
  <div class="video-card">
    <img src="{{ video.thumbnail_url }}" alt="Thumbnail of {{ video.title }}" data-stream-url="{{ video.stream_url }}" />
    <div class="video-details">
      <div class="video-title">{{ video.title }}</div>
      <!-- Nouvelle icône de lecture -->
      <i class="fas fa-play play-icon" data-stream-url="{{ video.stream_url }}" title="Play externally"></i>
      <div class="loader">Loading...</div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}

<script>
document.querySelectorAll('.play-icon').forEach(icon => {
  icon.addEventListener('click', async () => {
    const streamUrl = icon.getAttribute('data-stream-url');
    const loader = icon.nextElementSibling;
    loader.style.display = 'inline-block';

    try {
      const response = await fetch('/get-download-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stream_url: streamUrl })
      });

      const directUrl = await response.text();

      // Ouvre dans une nouvelle fenêtre (ou onglet)
      window.open(directUrl, '_blank');

      // OU pour lancer dans mpv si handler local :
      // window.location.href = `mpv://${directUrl}`;

    } catch (err) {
      alert("Erreur : " + err.message);
    } finally {
      loader.style.display = 'none';
    }
  });
});
</script>
