<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Video Gallery{% endblock %}</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <div class="header">
    <h1>Video Gallery</h1>
    <button class="menu-button"><i class="fas fa-bars"></i></button>
    <div class="menu">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </div>

  {% block content %}{% endblock %}


<script>
document.querySelectorAll('.play-icon').forEach(icon => {
  icon.addEventListener('click', async () => {
    const streamUrl = icon.getAttribute('data-stream-url');
    const loader = icon.nextElementSibling;
    loader.style.display = 'inline-block';

    try {
      const response = await fetch('/get-download-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stream_url: streamUrl })
      });

      const directUrl = await response.text();

      // Ouvre dans une nouvelle fenêtre (ou onglet)
      window.open(directUrl, '_blank');

      // OU pour lancer dans mpv si handler local :
      // window.location.href = `mpv://${directUrl}`;

    } catch (err) {
      alert("Erreur : " + err.message);
    } finally {
      loader.style.display = 'none';
    }
  });
});
</script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
